<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Pro</title>
  <script>
    // Apply saved theme before first paint (style flash prevention).
    (function () {
      var t = "midnight";
      try {
        var s = JSON.parse(localStorage.getItem("cp:settings") || "{}");
        var pal = ["midnight", "earthy", "earthy-green", "cream"].indexOf(s.theme) >= 0 ? s.theme : "midnight";
        var light = s.mode === "light";
        t = pal === "cream" ? (light ? "cream" : "cream-dark") : (light ? pal + "-light" : pal);
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=234" />
  <script>
    // Fail-safe: the module app hides both screens until it boots. If it
    // doesn't boot, surface the connect screen + an explanation instead of
    // leaving an empty page. ANY error is shown (no suppression) so the user
    // can report exactly what happened.
    window.__booted = false;
    window.__rev = "b49";
    function showBootError(msg, stack) {
      var o = document.getElementById('onboarding');
      var err = document.getElementById('bootError');
      if (o) o.classList.remove('hidden');
      if (err) {
        var trace = (stack || '').split('\n').slice(0, 2).join('  ⤷  ');
        err.textContent = msg + (trace ? '  [at: ' + trace + ']' : '') + '  (rev ' + window.__rev + ')';
        err.classList.remove('hidden');
      }
    }
    window.addEventListener('error', function (e) {
      showBootError('JS ERROR: ' + (e.message || 'unknown (see DevTools console: Cmd+Option+J)'), e.error && e.error.stack);
    });
    window.addEventListener('unhandledrejection', function (e) {
      showBootError('JS ERROR: ' + (e.reason && e.reason.message ? e.reason.message : 'unknown (see DevTools console: Cmd+Option+J)'), e.reason && e.reason.stack);
    });
    setTimeout(function () {
      if (location.protocol === 'file:') {
        showBootError('You opened index.html directly from disk. ES modules need a server. In the canvas-pro folder run:  npm start   then open  http://localhost:8000');
      } else if (!window.__booted) {
        showBootError('The app did not start. Reload the page, or check the DevTools console (Cmd+Option+J).');
      }
    }, 2500);
  </script>
</head>
<body>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="logo">◧</span>
        <span class="brand-name">Canvas&nbsp;Pro</span>
        <span id="versionBadge" class="badge badge-beta">BETA</span>
      </div>
      <div class="topbar-right">
        <button id="modeToggle" class="icon-btn" title="Toggle dark / light"></button>
        <button id="refreshBtn" class="btn btn-ghost" title="Refresh data">Refresh</button>
        <span id="syncState" class="sync-state"></span>
        <button id="userBtn" class="user-chip" title="Account / settings"></button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        <div class="nav-group">Home</div>
        <button class="tab-btn active" data-tab="dashboard"><span class="ti">📊</span>Dashboard</button>

        <div class="nav-group">Classwork</div>
        <button class="tab-btn" data-tab="assignments"><span class="ti">📝</span>Assignments</button>
        <button class="tab-btn" data-tab="tests"><span class="ti">🧪</span>Tests</button>
        <button class="tab-btn" data-tab="todo"><span class="ti">✅</span>To-Do</button>
        <button class="tab-btn" data-tab="latelist"><span class="ti">🕗</span>Late Work</button>
        <button class="tab-btn" data-tab="grades"><span class="ti">🎯</span>Grades</button>

        <div class="nav-group">Study</div>
        <button class="tab-btn" data-tab="study"><span class="ti">🧠</span>Study Plan</button>
        <button class="tab-btn" data-tab="curve"><span class="ti">📈</span>Curve Calc</button>
        <button class="tab-btn" data-tab="ai"><span class="ti">🤖</span>AI Assistant</button>

        <div class="nav-group">Resources</div>
        <button class="tab-btn" data-tab="documents"><span class="ti">📁</span>Documents</button>
        <button class="tab-btn" data-tab="announcements"><span class="ti">📣</span>Announcements</button>

        <div class="nav-group">System</div>
        <button class="tab-btn" data-tab="settings"><span class="ti">⚙️</span>Settings</button>
      </nav>

      <main id="mainContent" class="main"></main>
    </div>
  </div>

  <div class="loading overlay hidden" id="globalLoading">
    <div class="spinner"></div>
    <p id="loadingText">Loading…</p>
  </div>

  <div id="onboarding" class="onboarding">

    <div class="onboarding-card">
      <h1>◧ Canvas Pro</h1>
      <p class="subtitle">A better, grade-aware view of your Canvas classes.</p>
      <p class="subtitle">Your access token stays on this device — it is never uploaded.</p>

      <label class="field">
        <span>Canvas base URL</span>
        <input id="onCanvasUrl" type="url" placeholder="https://myschool.instructure.com" />
      </label>

      <label class="field">
        <span>Canvas access token</span>
        <input id="onToken" type="password" placeholder="Paste your token (Account → Settings → New Access Token)" />
      </label>

      <p class="hint error hidden" id="onboardingError"></p>
      <p class="hint error hidden" id="bootError"></p>
      <p class="hint" id="serverNote">Checking local server…</p>

      <button id="onConnect" class="btn btn-primary btn-block">Connect to Canvas</button>
    </div>
  </div>

  <div id="toastWrap"></div>

  <script type="module" src="js/app.js?v=210"></script>
</body>
</html>
